name: Banking NL2SQL CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: banking-nl2sql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test, security and coverage gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://banking_app:ci-app-password@127.0.0.1:5432/banking_nl2sql
      ANALYTICS_DATABASE_URL: postgresql+asyncpg://banking_reader:ci-reader-password@127.0.0.1:5432/banking_nl2sql
      SYNTHETIC_USER_PASSWORD: ci-synthetic-user-password-2026
      JWT_SECRET_KEY: ci-jwt-secret-key-with-at-least-32-characters
      OPENAI_API_KEY: test-key-not-used
      LOG_TO_CONSOLE: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Create restricted database roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE banking_app LOGIN PASSWORD 'ci-app-password';
          CREATE ROLE banking_reader LOGIN PASSWORD 'ci-reader-password';
          CREATE DATABASE banking_nl2sql OWNER banking_app;
          SQL
      - name: Run migrations and seed synthetic test data
        run: |
          alembic upgrade head
          python -m data_generator.seed_identity
          python -m data_generator.seed_banking_facts
      - name: Grant read-only analytics access
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d banking_nl2sql -v ON_ERROR_STOP=1 <<'SQL'
          GRANT CONNECT ON DATABASE banking_nl2sql TO banking_reader;
          GRANT USAGE ON SCHEMA public TO banking_reader;
          GRANT SELECT ON ALL TABLES IN SCHEMA public TO banking_reader;
          ALTER DEFAULT PRIVILEGES FOR ROLE banking_app IN SCHEMA public GRANT SELECT ON TABLES TO banking_reader;
          ALTER ROLE banking_reader SET default_transaction_read_only = on;
          SQL
      - name: Validate synthetic banking relationships
        run: python -m scripts.validate_banking_data
      - name: Run complete release gate
        run: python -m pytest --cov=backend --cov-fail-under=80 --cov-report=term --cov-report=xml:coverage.xml -q
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error

  deploy:
    name: Build and deploy to Cloud Run
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      AR_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
      API_SERVICE: ${{ vars.GCP_API_SERVICE }}
      UI_SERVICE: ${{ vars.GCP_UI_SERVICE }}
      MIGRATION_JOB: ${{ vars.GCP_MIGRATION_JOB }}
      CLOUD_SQL_INSTANCE: ${{ vars.GCP_CLOUD_SQL_INSTANCE }}
      RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v5
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - name: Build and push immutable images
        run: |
          API_IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPOSITORY}/banking-api:${GITHUB_SHA}"
          UI_IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPOSITORY}/banking-ui:${GITHUB_SHA}"
          docker build -f deploy/Dockerfile.api -t "$API_IMAGE" .
          docker build -f deploy/Dockerfile.frontend -t "$UI_IMAGE" .
          docker push "$API_IMAGE"
          docker push "$UI_IMAGE"
          echo "API_IMAGE=$API_IMAGE" >> "$GITHUB_ENV"
          echo "UI_IMAGE=$UI_IMAGE" >> "$GITHUB_ENV"
      - name: Deploy and execute database migration job
        run: |
          gcloud run jobs deploy "$MIGRATION_JOB" \
            --project="$PROJECT_ID" --region="$REGION" --image="$API_IMAGE" \
            --service-account="$RUNTIME_SERVICE_ACCOUNT" \
            --set-cloudsql-instances="$CLOUD_SQL_INSTANCE" \
            --set-env-vars="ENVIRONMENT=production,LOG_TO_CONSOLE=true" \
            --set-secrets="DATABASE_URL=banking-database-url:latest" \
            --command=alembic --args=upgrade,head --max-retries=1 --task-timeout=10m --quiet
          gcloud run jobs execute "$MIGRATION_JOB" \
            --project="$PROJECT_ID" --region="$REGION" --wait --quiet
      - name: Deploy FastAPI
        run: |
          gcloud run deploy "$API_SERVICE" \
            --project="$PROJECT_ID" --region="$REGION" --image="$API_IMAGE" \
            --service-account="$RUNTIME_SERVICE_ACCOUNT" \
            --set-cloudsql-instances="$CLOUD_SQL_INSTANCE" \
            --set-env-vars="ENVIRONMENT=production,LOG_TO_CONSOLE=true,DATABASE_POOL_SIZE=5,DATABASE_MAX_OVERFLOW=5" \
            --set-secrets="DATABASE_URL=banking-database-url:latest,ANALYTICS_DATABASE_URL=banking-analytics-url:latest,OPENAI_API_KEY=openai-api-key:latest,JWT_SECRET_KEY=banking-jwt-secret:latest,SYNTHETIC_USER_PASSWORD=banking-synthetic-password:latest" \
            --cpu=1 --memory=1Gi --concurrency=20 --min=0 --max=5 \
            --allow-unauthenticated --quiet
          API_URL="$(gcloud run services describe "$API_SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')"
          echo "API_URL=$API_URL" >> "$GITHUB_ENV"
      - name: Verify API health
        run: curl --fail --retry 6 --retry-delay 5 "${API_URL}/health"
      - name: Deploy Streamlit UI
        run: |
          gcloud run deploy "$UI_SERVICE" \
            --project="$PROJECT_ID" --region="$REGION" --image="$UI_IMAGE" \
            --service-account="$RUNTIME_SERVICE_ACCOUNT" \
            --set-env-vars="BANKING_API_URL=${API_URL}" \
            --cpu=1 --memory=1Gi --concurrency=40 --min=0 --max=3 \
            --allow-unauthenticated --quiet
          UI_URL="$(gcloud run services describe "$UI_SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')"
          echo "UI_URL=$UI_URL" >> "$GITHUB_ENV"
      - name: Deployment summary
        run: |
          echo "### Cloud Run deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: ${API_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Streamlit: ${UI_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image revision: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
